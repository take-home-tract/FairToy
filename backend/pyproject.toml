[project]
name = "fairtoy-backend"
version = "0.1.0"
description = "FairToy API: flag a supplier for child labor and trace the affected toys"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pyjwt>=2.10",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2",  # used by FastAPI's test client
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
